name: Publish Desktop macOS Preview

on:
  workflow_run:
    workflows: [Desktop macOS Preview]
    types: [completed]
  pull_request_target:
    branches: [pylon]
    types: [closed, unlabeled]

permissions:
  contents: read

jobs:
  prepare:
    if: >-
      github.repository == 'pylon-code/pylon' &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
       (github.event_name == 'pull_request_target' &&
        (github.event.action == 'closed' || github.event.label.name == 'preview:mac')))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      pr: ${{ steps.prepare.outputs.pr }}
      mode: ${{ steps.prepare.outputs.mode }}
      artifact_id: ${{ steps.prepare.outputs.artifact_id }}
    steps:
      # Load only the helper from this trusted workflow's immutable commit.
      # A full Git index includes vendored gitlinks without root submodule metadata,
      # which makes actions/checkout credential cleanup fail even with sparse checkout.
      - id: prepare
        uses: actions/github-script@v8
        env:
          PREVIEW_HELPER_REF: ${{ github.workflow_sha }}
        with:
          script: |
            const operation = 'prepare';
            const fs = require('node:fs/promises');
            const path = require('node:path');
            const { createHash } = require('node:crypto');
            const ref = process.env.PREVIEW_HELPER_REF;
            if (!/^[a-f0-9]{40}$/.test(ref ?? '')) throw new Error('Expected an immutable workflow commit');
            const helper = '.github/scripts/desktop-macos-preview.cjs';
            const { data } = await github.rest.repos.getContent({ ...context.repo, path: helper, ref });
            if (data?.type !== 'file' || data.path !== helper || data.encoding !== 'base64' ||
                typeof data.content !== 'string' || !Number.isSafeInteger(data.size) ||
                data.size <= 0 || data.size > 1024 * 1024 || !/^[a-f0-9]{40}$/.test(data.sha ?? '')) {
              throw new Error('Invalid trusted preview helper response');
            }
            const encoded = data.content.replace(/\n/g, '');
            const source = Buffer.from(encoded, 'base64');
            const digest = createHash('sha1').update(`blob ${source.length}\0`).update(source).digest('hex');
            if (source.length !== data.size || source.toString('base64') !== encoded || digest !== data.sha) {
              throw new Error('Trusted preview helper content verification failed');
            }
            const directory = await fs.mkdtemp(path.join(process.env.RUNNER_TEMP, 'pylon-preview-helper-'));
            const filename = path.join(directory, 'desktop-macos-preview.cjs');
            await fs.writeFile(filename, source, { flag: 'wx', mode: 0o600 });
            const { [operation]: run } = require(filename);
            await run({ github, context, core });

  publish:
    needs: prepare
    if: needs.prepare.outputs.mode != 'skip'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      pull-requests: write
    # Publication and cleanup for one PR share a lock. Never cancel an upload or
    # delete halfway through; every queued invocation reconciles current PR state.
    concurrency:
      group: desktop-macos-preview-publication-${{ needs.prepare.outputs.pr }}
      cancel-in-progress: false
    steps:
      - name: Download preview artifact
        if: needs.prepare.outputs.mode == 'publish'
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/pylon-macos-preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Reconcile public preview and PR comment
        uses: actions/github-script@v8
        env:
          PREVIEW_DIRECTORY: ${{ runner.temp }}/pylon-macos-preview
          PREVIEW_PR: ${{ needs.prepare.outputs.pr }}
          PREVIEW_HELPER_REF: ${{ github.workflow_sha }}
        with:
          script: |
            const operation = 'reconcile';
            const fs = require('node:fs/promises');
            const path = require('node:path');
            const { createHash } = require('node:crypto');
            const ref = process.env.PREVIEW_HELPER_REF;
            if (!/^[a-f0-9]{40}$/.test(ref ?? '')) throw new Error('Expected an immutable workflow commit');
            const helper = '.github/scripts/desktop-macos-preview.cjs';
            const { data } = await github.rest.repos.getContent({ ...context.repo, path: helper, ref });
            if (data?.type !== 'file' || data.path !== helper || data.encoding !== 'base64' ||
                typeof data.content !== 'string' || !Number.isSafeInteger(data.size) ||
                data.size <= 0 || data.size > 1024 * 1024 || !/^[a-f0-9]{40}$/.test(data.sha ?? '')) {
              throw new Error('Invalid trusted preview helper response');
            }
            const encoded = data.content.replace(/\n/g, '');
            const source = Buffer.from(encoded, 'base64');
            const digest = createHash('sha1').update(`blob ${source.length}\0`).update(source).digest('hex');
            if (source.length !== data.size || source.toString('base64') !== encoded || digest !== data.sha) {
              throw new Error('Trusted preview helper content verification failed');
            }
            const directory = await fs.mkdtemp(path.join(process.env.RUNNER_TEMP, 'pylon-preview-helper-'));
            const filename = path.join(directory, 'desktop-macos-preview.cjs');
            await fs.writeFile(filename, source, { flag: 'wx', mode: 0o600 });
            const { [operation]: run } = require(filename);
            await run({ github, context, core,
              prNumber: Number(process.env.PREVIEW_PR),
              directory: process.env.PREVIEW_DIRECTORY });
