name: Publish model manifest

on:
  push:
    branches:
      - pylon
    paths:
      - apps/server/src/provider/model-manifest.json
      - .github/workflows/publish-model-manifest.yml
      - apps/server/scripts/prepare-model-manifests.ts
      - apps/server/src/provider/modelManifestPublication.ts

permissions:
  contents: read

concurrency:
  group: publish-model-manifest
  cancel-in-progress: false

jobs:
  publish:
    name: Publish public manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout approved source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          # Removing checkout auth traverses vendored gitlinks without .gitmodules.
          # Keep the job-scoped, read-only token until checkout post-job cleanup.
          persist-credentials: true
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Validate and prepare public manifests
        run: node apps/server/scripts/prepare-model-manifests.ts /tmp/pylon-model-manifests

      - name: Check source revision is current
        id: source_revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --max-filesize 32768 \
            --retry 2 \
            --retry-all-errors \
            --retry-delay 1 \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output /tmp/pylon-current-branch.json \
            "${GITHUB_API_URL}/repos/${SOURCE_REPOSITORY}/branches/pylon"
          current_sha="$(
            node <<'NODE'
          const branch = JSON.parse(require("node:fs").readFileSync("/tmp/pylon-current-branch.json", "utf8"));
          const sha = branch?.commit?.sha;
          if (typeof sha !== "string" || !/^[0-9a-f]{40}$/.test(sha)) {
            throw new Error("Pylon branch response did not contain a commit SHA");
          }
          process.stdout.write(sha);
          NODE
          )"
          if [[ "${current_sha}" != "${SOURCE_SHA}" ]]; then
            echo "Skipping superseded source revision ${SOURCE_SHA}; pylon is now ${current_sha}."
            echo "should_publish=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "should_publish=true" >> "${GITHUB_OUTPUT}"

      - name: Check releases repository credentials
        if: steps.source_revision.outputs.should_publish == 'true'
        shell: bash
        env:
          RELEASES_REPO_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASES_REPO_TOKEN:-}" ]]; then
            echo "The RELEASES_REPO_TOKEN secret is required to publish the model manifest." >&2
            exit 1
          fi

      - name: Checkout public releases repository
        if: steps.source_revision.outputs.should_publish == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: pylon-code/pylon-releases
          ref: main
          path: public
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          persist-credentials: true

      - name: Publish manifest without private source metadata
        if: steps.source_revision.outputs.should_publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/pylon-model-manifests/model-manifest.json public/model-manifest.json
          cp /tmp/pylon-model-manifests/model-catalog.json public/model-catalog.json
          cd public
          if [[ -z "$(git status --porcelain -- model-manifest.json model-catalog.json)" ]]; then
            echo "The public manifest is already current."
            exit 0
          fi
          git config user.name "pylon-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add model-manifest.json model-catalog.json
          git commit -m "chore: update model manifest"
          git push origin HEAD:main
